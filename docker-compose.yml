services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clouddeploy
      POSTGRES_USER: clouddeploy
      POSTGRES_PASSWORD: clouddeploy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddeploy -d clouddeploy"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://clouddeploy:clouddeploy@db:5432/clouddeploy
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-this-key-before-hosting}
      ALLOWED_IMAGES: ${ALLOWED_IMAGES:-docker.io/nginxinc/nginx-unprivileged:stable-alpine}
      KUBE_MODE: "off"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && exec node dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  pgdata:
