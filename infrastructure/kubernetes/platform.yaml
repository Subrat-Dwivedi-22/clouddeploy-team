apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddeploy-api
  namespace: clouddeploy-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: clouddeploy-api }
  template:
    metadata:
      labels: { app: clouddeploy-api }
    spec:
      serviceAccountName: clouddeploy-api
      initContainers:
        - name: migrate
          image: clouddeploy-api:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "migrate"]
          envFrom:
            - secretRef: { name: clouddeploy-settings }
      containers:
        - name: api
          image: clouddeploy-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef: { name: clouddeploy-settings }
          env:
            - { name: KUBE_MODE, value: "api" }
            - { name: KUBE_NAMESPACE, value: "clouddeploy-workloads" }
            - { name: PREVIEW_PORT, value: "3102" }
            - { name: TRAFFIC_METRICS_URL, value: "http://clouddeploy-preview:8081" }
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: clouddeploy-system
spec:
  selector: { app: clouddeploy-api }
  ports:
    - { port: 4000, targetPort: 4000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddeploy-web
  namespace: clouddeploy-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: clouddeploy-web }
  template:
    metadata:
      labels: { app: clouddeploy-web }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: clouddeploy-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: clouddeploy-system
spec:
  selector: { app: clouddeploy-web }
  ports:
    - { port: 3000, targetPort: 3000 }
