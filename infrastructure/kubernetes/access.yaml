apiVersion: v1
kind: Namespace
metadata:
  name: clouddeploy-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: clouddeploy-workloads
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clouddeploy-api
  namespace: clouddeploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clouddeploy-manager
  namespace: clouddeploy-workloads
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clouddeploy-manager
  namespace: clouddeploy-workloads
subjects:
  - kind: ServiceAccount
    name: clouddeploy-api
    namespace: clouddeploy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clouddeploy-manager
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-demo-workloads
  namespace: clouddeploy-workloads
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-budget
  namespace: clouddeploy-workloads
spec:
  hard:
    count/deployments.apps: "12"
    pods: "24"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "6"
    limits.memory: 3Gi
