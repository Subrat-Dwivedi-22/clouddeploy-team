apiVersion: v1
kind: Service
metadata: { name: clouddeploy-preview-local, namespace: clouddeploy-system }
spec:
  type: NodePort
  selector: { app: clouddeploy-preview }
  ports:
    - { name: preview, port: 8080, targetPort: 8080, nodePort: 30082 }
    - { name: metrics, port: 8081, targetPort: 8081, nodePort: 30083 }
